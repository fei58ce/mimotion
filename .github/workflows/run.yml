name: 刷步数

on:
  schedule:
    - cron: '30 3 * * *' # 北京时间 11:30
    - cron: '0 9 * * *' # 北京时间 17:00
  workflow_dispatch:
    inputs:
      step_slot:
        description: '步数范围（midday: 16000–17000，afternoon: 18000–22000，auto: 按时间计算）'
        type: choice
        required: true
        default: auto
        options:
          - auto
          - midday
          - afternoon

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout codes
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.PAT }} #此处PAT需要申请，教程详见：README
      - name: Update system and install zsh
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get install zsh -y
          
      - name: 初始化Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          
      - name: 开始
        env:
            CONFIG: ${{ secrets.CONFIG }}
            AES_KEY: ${{ secrets.AES_KEY }}
            STEP_SLOT: >-
              ${{ github.event.schedule == '30 3 * * *' && 'midday'
                  || github.event.schedule == '0 9 * * *' && 'afternoon'
                  || inputs.step_slot || 'auto' }}
        run: |
          pip3 install -r requirements.txt
          python3 main.py

      - name: persist tokens
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add .
          git commit -m "persist tokens trigger by ${{ github.event_name }}"
          git push origin master
